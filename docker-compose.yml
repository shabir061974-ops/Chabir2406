services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Optional: enable auth in production
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: faiha
    #   MONGO_INITDB_ROOT_PASSWORD: changeme
    networks: [faiha]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: [mongo]
    volumes:
      # Product images live in a plain ./uploads folder next to the app (easy to browse via SFTP).
      - ./uploads:/app/uploads
      # Shared backup dir so the admin "Backup Now" button writes alongside the nightly cron backups.
      - ../mongo-backups:/backups
    networks: [faiha]
    # backend listens on 8001 internally; exposed through the frontend nginx proxy

  frontend:
    build:
      context: ./frontend
      args:
        # Public URL where the app is served (your domain). API is reached at <this>/api
        REACT_APP_BACKEND_URL: "https://www.faihacoopkw.com"
    restart: unless-stopped
    depends_on: [backend]
    networks: [faiha]
    # No host ports: Caddy (below) fronts the app on 80/443 and terminates TLS.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [faiha]

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  faiha:
